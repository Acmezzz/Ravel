name: Desktop Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Refuse tracked build artifacts
        run: |
          tracked="$(git ls-files -- '*/release/*' 'release/*' '*/dist/*' 'dist/*' '*/node_modules/*' 'node_modules/*')"
          if [ -n "$tracked" ]; then
            echo "::error::Build artifacts must not be tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Repo checks
        run: npm run check

      - name: Desktop tests
        run: npm test --workspace=@ravel/desktop

      - name: Desktop typecheck (Electron main + renderer)
        run: |
          npm run typecheck --workspace=@ravel/desktop
          npm run typecheck:renderer --workspace=@ravel/desktop

      - name: Build renderer
        run: npm run build:renderer --workspace=@ravel/desktop

      - name: Offline release gate
        run: npm run release:gate --workspace=@ravel/desktop

  packaged-smoke:
    # Real unpacked packaging + launch verification on an Electron-capable runner.
    runs-on: ubuntu-latest
    needs: check-and-test
    timeout-minutes: 30
    env:
      RAVEL_RELEASE_DIR: ${{ github.workspace }}/apps/ravel-desktop/release/linux-unpacked
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Pi runtime packages
        run: npm run build:offline

      - name: Build renderer
        run: npm run build:renderer --workspace=@ravel/desktop

      - name: Package unpacked desktop app
        run: npm run package:dir --workspace=@ravel/desktop

      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libgtk-3-0t64

      - name: Electron smoke
        run: xvfb-run -a npm run electron:smoke --workspace=@ravel/desktop

      - name: Omega -> Ravel userData migration smoke
        run: xvfb-run -a npm run migration:smoke --workspace=@ravel/desktop
