<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    CSP (system_design.md §1.1 / 安全红线):
      - default-src 'self'; script-src 'self' app:  → no inline scripts, no eval.
        This is the line that actually matters and it stays strict.
      - style-src allows 'unsafe-inline' on purpose: xterm (terminal) and React
        Flow (Histos graph) inject their layout styles at runtime as inline
        `<style>`/`style=` with no way to carry a nonce, so a nonce-only policy
        silently broke both surfaces in the packaged app. Inline styles cannot
        execute script; `object-src`/`base-uri`/`form-action` stay locked down.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app:; style-src 'self' app: 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'self' app:" />
  <title>Ravel Desktop</title>
  <link rel="stylesheet" href="./dist/assets/style.css" />
</head>
<body>
  <div id="root"></div>
  <script src="./dist/assets/index.js"></script>
</body>
</html>
